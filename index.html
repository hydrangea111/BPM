<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAP / BPM UNIT</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23141416'/%3E%3Cpath%20d='M22%2052%2028%2014h8l6%2038z'%20fill='none'%20stroke='%23ffb020'%20stroke-width='4'%20stroke-linejoin='round'/%3E%3Cpath%20d='M32%2044%2042%2018'%20stroke='%23e8483f'%20stroke-width='4'%20stroke-linecap='round'/%3E%3Ccircle%20cx='40'%20cy='23'%20r='4.5'%20fill='%23ffb020'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #141416;
    --panel-a: #2c2d32;
    --panel-b: #1b1c20;
    --panel-border: #3d3e44;
    --screen: #0a0b0c;
    --amber: #ffb020;
    --amber-dim: #6b4a18;
    --amber-glow: rgba(255, 176, 32, .55);
    --red: #e8483f;
    --red-dark: #a52f27;
    --text: #eeece6;
    --muted: #8b8d93;
    --steel: #55575e;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #1f2024 0%, var(--bg) 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
  }

  .unit {
    position: relative;
    width: 100%;
    max-width: min(94vw, 640px);
    background: linear-gradient(155deg, var(--panel-a), var(--panel-b) 70%);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: clamp(22px, 4vw, 36px) clamp(24px, 4.5vw, 42px) clamp(26px, 5vw, 46px);
    box-shadow:
      0 30px 60px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.05);
  }

  /* 브러시드 메탈 텍스처 */
  .unit::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: repeating-linear-gradient(
      100deg,
      rgba(255,255,255,.015) 0px,
      rgba(255,255,255,.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .screw {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7c7e85, var(--steel) 60%, #2c2d31);
    box-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .screw::after {
    content: '';
    position: absolute;
    top: 50%; left: 15%;
    width: 70%; height: 1px;
    background: rgba(0,0,0,.5);
    transform: rotate(35deg);
  }
  .screw.tl { top: 11px; left: 11px; }
  .screw.tr { top: 11px; right: 11px; }
  .screw.bl { bottom: 11px; left: 11px; }
  .screw.br { bottom: 11px; right: 11px; }

  /* 상단 라벨 바 */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6px 16px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--muted);
  }

  .power-led {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 6px 1px var(--red);
    animation: breathe 2.6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
  }

  .model {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .1em;
  }

  .fullscreen-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    background: transparent;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }

  .fullscreen-btn:hover {
    color: var(--text);
    border-color: var(--amber-dim);
    background: rgba(255,176,32,.06);
  }

  .fullscreen-btn svg { width: 13px; height: 13px; }
  .fullscreen-btn .icon-collapse { display: none; }
  .fullscreen-btn.is-full .icon-expand { display: none; }
  .fullscreen-btn.is-full .icon-collapse { display: block; }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* LED 스크린 */
  .screen {
    position: relative;
    background: var(--screen);
    border-radius: 10px;
    padding: 20px 18px 16px;
    margin: 0 6px 22px;
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,.8),
      inset 0 0 0 1px #000;
    overflow: hidden;
    text-align: right;
  }

  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .bpm-row {
    display: flex;
    align-items: baseline;
    justify-content: flex-end;
    gap: 10px;
    line-height: 1;
  }

  .bpm-display {
    font-family: 'Major Mono Display', monospace;
    font-size: clamp(2.4rem, 7vw, 4.6rem);
    font-variant-numeric: tabular-nums;
    color: var(--amber);
    text-shadow: 0 0 10px var(--amber-glow), 0 0 26px var(--amber-glow);
    transition: text-shadow .15s ease;
  }

  .bpm-unit {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--amber-dim);
  }

  .screen-sub {
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: .12em;
    color: #5a4520;
    text-align: right;
  }

  /* TAP 링 + 버튼 */
  .tap-zone {
    position: relative;
    width: min(320px, 62%);
    aspect-ratio: 1;
    margin: clamp(4px, 1.5vw, 14px) auto 20px;
  }

  .led-ring {
    position: absolute;
    inset: 0;
  }

  .led-ring .dot {
    position: absolute;
    top: 50%; left: 50%;
    width: 5px;
    height: 5px;
    margin: -2.5px;
    border-radius: 50%;
    background: #3a3b40;
    box-shadow: inset 0 1px 1px rgba(0,0,0,.5);
    transition: background .12s ease, box-shadow .12s ease;
  }

  .led-ring .dot.lit {
    background: var(--amber);
    box-shadow: 0 0 6px 1px var(--amber-glow);
  }

  .led-ring.flash .dot.lit {
    background: #fff4d9;
    box-shadow: 0 0 12px 3px var(--amber-glow);
  }

  .tap-button {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 73%;
    height: 73%;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    outline: none;
    background:
      linear-gradient(165deg, #b1443c 0%, #93342d 45%, #732922 100%);
    box-shadow:
      0 8px 18px rgba(0,0,0,.4),
      inset 0 1px 1px rgba(255,255,255,.12),
      inset 0 -10px 16px rgba(0,0,0,.3);
    color: rgba(255,255,255,.92);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: clamp(1.2em, 3vw, 1.7em);
    letter-spacing: .1em;
    transition: transform .08s ease, box-shadow .08s ease, background .08s ease;
  }

  .tap-button:hover {
    background:
      linear-gradient(165deg, #bd4a41 0%, #99372f 45%, #782a23 100%);
    box-shadow:
      0 10px 20px rgba(0,0,0,.45),
      inset 0 1px 1px rgba(255,255,255,.14),
      inset 0 -10px 16px rgba(0,0,0,.3);
  }

  .tap-button:active,
  .tap-button.active {
    transform: translate(-50%, -50%) scale(.96);
    background:
      linear-gradient(165deg, #8f342d 0%, #772b25 45%, #5f221d 100%);
    box-shadow:
      0 3px 8px rgba(0,0,0,.4),
      inset 0 3px 7px rgba(0,0,0,.4);
  }

  /* 하단 계기판 */
  .dash {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 6px 0;
  }

  .readout-block {
    text-align: left;
  }

  .readout-label {
    font-size: 10px;
    letter-spacing: .14em;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .readout-value {
    font-family: 'Major Mono Display', monospace;
    font-size: 1.05em;
    color: var(--text);
  }

  .steady-leds {
    display: flex;
    gap: 4px;
    margin-top: 5px;
  }

  .steady-leds span {
    width: 14px;
    height: 4px;
    border-radius: 2px;
    background: #3a3b40;
    transition: background .15s ease, box-shadow .15s ease;
  }

  .steady-leds span.on {
    background: var(--amber);
    box-shadow: 0 0 5px var(--amber-glow);
  }

  .reset-button {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--panel-border);
    color: var(--muted);
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    transition: all .15s ease;
  }

  .reset-button:hover {
    color: var(--text);
    border-color: var(--amber-dim);
    background: rgba(255,176,32,.06);
  }

  .reset-button svg { width: 13px; height: 13px; }

  .instructions {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px dashed var(--panel-border);
    font-size: 11.5px;
    line-height: 1.6;
    letter-spacing: .02em;
    color: var(--muted);
    text-align: center;
  }

  /* 접근성: 모션 최소화 */
  @media (prefers-reduced-motion: reduce) {
    .power-led { animation: none; }
    .bpm-display, .tap-button, .led-ring .dot { transition: none; }
  }

  button:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="unit">
  <span class="screw tl"></span><span class="screw tr"></span>
  <span class="screw bl"></span><span class="screw br"></span>

  <div class="topbar">
    <div class="brand"><span class="power-led"></span>TAP TEMPO UNIT</div>
    <div class="topbar-right">
      <div class="model">MK.1</div>
      <button class="fullscreen-btn" id="fullscreenBtn" title="전체화면" aria-label="전체화면 전환">
        <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
      </button>
    </div>
  </div>

  <div class="screen">
    <div class="bpm-row">
      <span class="bpm-display" id="bpmDisplay">--</span>
      <span class="bpm-unit">BPM</span>
    </div>
    <div class="screen-sub" id="screenSub">TAP TO START</div>
  </div>

  <div class="tap-zone">
    <div class="led-ring" id="ledRing"></div>
    <button class="tap-button" id="tapBtn">TAP</button>
  </div>

  <div class="dash">
    <div class="readout-block">
      <div class="readout-label">TAPS</div>
      <div class="readout-value" id="tapCount">0</div>
      <div class="steady-leds" id="steadyLeds">
        <span></span><span></span><span></span>
      </div>
    </div>

    <button class="reset-button" id="resetBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      RESET
    </button>
  </div>

  <p class="instructions">
    버튼 클릭 또는 아무 키보드 키로 박자를 두드리세요.<br>
    링 LED는 탭할 때마다 채워지고, BPM이 잡히면 그 템포로 깜빡입니다.
  </p>
</div>

<script>
  const bpmDisplay   = document.getElementById('bpmDisplay');
  const screenSub    = document.getElementById('screenSub');
  const tapBtn       = document.getElementById('tapBtn');
  const tapCountDisplay = document.getElementById('tapCount');
  const resetBtn     = document.getElementById('resetBtn');
  const ledRing       = document.getElementById('ledRing');
  const steadyLeds    = document.getElementById('steadyLeds').children;
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  let timestamps = [];
  let flashTimer = null;

  // ---- LED 링 생성 (탭 진행률을 표시하는 원형 게이지) ----
  const DOT_COUNT = 24;
  const dots = [];
  for (let i = 0; i < DOT_COUNT; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    ledRing.appendChild(dot);
    dots.push(dot);
  }

  // 실제 렌더링된 링 크기를 기준으로 도트 위치 재계산 (반응형/전체화면 대응)
  function layoutRing() {
    const w = ledRing.clientWidth;
    const h = ledRing.clientHeight;
    if (!w || !h) return;
    const cx = w / 2;
    const cy = h / 2;
    const radius = Math.min(w, h) / 2 - 4;
    dots.forEach((dot, i) => {
      const angle = (i / DOT_COUNT) * 2 * Math.PI - Math.PI / 2;
      dot.style.left = (cx + radius * Math.cos(angle)) + 'px';
      dot.style.top = (cy + radius * Math.sin(angle)) + 'px';
    });
  }

  let resizeRaf = null;
  function scheduleLayout() {
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(layoutRing);
  }
  window.addEventListener('resize', scheduleLayout);
  scheduleLayout();

  function updateRing(count) {
    const lit = count % DOT_COUNT === 0 && count > 0 ? DOT_COUNT : count % DOT_COUNT;
    dots.forEach((d, i) => d.classList.toggle('lit', i < lit));
  }

  function ringFlashOnce() {
    ledRing.classList.add('flash');
    setTimeout(() => ledRing.classList.remove('flash'), 90);
  }

  function startTempoFlasher(bpm) {
    if (flashTimer) clearInterval(flashTimer);
    const intervalMs = 60000 / bpm;
    flashTimer = setInterval(ringFlashOnce, intervalMs);
  }

  function stopTempoFlasher() {
    if (flashTimer) clearInterval(flashTimer);
    flashTimer = null;
  }

  // ---- 안정도(STEADY) 표시: 최근 간격들의 변동폭 기준 ----
  function updateSteadiness(intervals) {
    const recent = intervals.slice(-8);
    if (recent.length < 2) {
      [...steadyLeds].forEach(l => l.classList.remove('on'));
      return;
    }
    const mean = recent.reduce((a, b) => a + b, 0) / recent.length;
    const variance = recent.reduce((a, b) => a + (b - mean) ** 2, 0) / recent.length;
    const cv = Math.sqrt(variance) / mean; // 변동계수

    let level = 1;
    if (cv < 0.03) level = 3;
    else if (cv < 0.08) level = 2;

    [...steadyLeds].forEach((l, i) => l.classList.toggle('on', i < level));
  }

  // ---- 탭 입력 처리 (기존 계산 로직 유지) ----
  function handleTap() {
    const now = Date.now();
    timestamps.push(now);

    if (timestamps.length > 30) {
      timestamps.shift();
    }

    bpmDisplay.style.textShadow = '0 0 22px var(--amber-glow), 0 0 40px var(--amber-glow)';
    setTimeout(() => { bpmDisplay.style.textShadow = ''; }, 140);

    let intervals = [];
    if (timestamps.length > 1) {
      for (let i = 1; i < timestamps.length; i++) {
        intervals.push(timestamps[i] - timestamps[i - 1]);
      }

      const averageInterval = intervals.reduce((sum, val) => sum + val, 0) / intervals.length;
      const bpm = Math.round(60000 / averageInterval);
      bpmDisplay.textContent = bpm;
      screenSub.textContent = 'LOCKED';
      startTempoFlasher(bpm);
      updateSteadiness(intervals);
    }

    tapCountDisplay.textContent = timestamps.length;
    updateRing(timestamps.length);
  }

  function resetCalculator() {
    timestamps = [];
    bpmDisplay.textContent = '--';
    screenSub.textContent = 'TAP TO START';
    tapCountDisplay.textContent = '0';
    stopTempoFlasher();
    updateRing(0);
    [...steadyLeds].forEach(l => l.classList.remove('on'));
  }

  tapBtn.addEventListener('click', handleTap);

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) {
      e.preventDefault();
    }
    if (e.repeat) return;

    tapBtn.classList.add('active');
    handleTap();
  });

  window.addEventListener('keyup', () => {
    tapBtn.classList.remove('active');
  });

  resetBtn.addEventListener('click', (e) => {
    resetCalculator();
    e.currentTarget.blur();
  });

  // ---- 전체화면 토글 ----
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.();
    }
  }

  fullscreenBtn.addEventListener('click', (e) => {
    toggleFullscreen();
    e.currentTarget.blur();
  });

  document.addEventListener('fullscreenchange', () => {
    fullscreenBtn.classList.toggle('is-full', !!document.fullscreenElement);
    scheduleLayout();
  });
</script>
</body>
</html>
